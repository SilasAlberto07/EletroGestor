appId: br.com.eletrogestor.app
productName: EletroGestor
copyright: Copyright © 2026 EletroGestor

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json

# Atualização automática: as versões novas são publicadas nas "Releases" do GitHub.
# Troque SEU_USUARIO_GITHUB pelo seu usuário (ou organização) do GitHub.
publish:
  provider: github
  owner: SEU_USUARIO_GITHUB
  repo: eletrogestor
  releaseType: release

win:
  target: nsis
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: EletroGestor

linux:
  target: AppImage
  icon: build/icon.png
