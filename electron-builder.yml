appId: br.com.eletrogestor.app
productName: EletroGestor
copyright: Copyright © 2026 EletroGestor

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json

win:
  target: nsis
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: EletroGestor

linux:
  target: AppImage
  icon: build/icon.png
